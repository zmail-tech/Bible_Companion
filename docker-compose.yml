services:
  bible-companion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bible-companion
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
